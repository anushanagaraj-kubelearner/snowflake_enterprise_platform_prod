name: Snowflake Production Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SnowSQL
        run: |
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.3/linux_x86_64/snowsql-linux_x86_64.bash
          bash snowsql-linux_x86_64.bash -y

      - name: Configure SnowSQL
        run: |
          mkdir -p ~/.snowsql

          cat > ~/.snowsql/config <<EOF
          [connections.prod]
          accountname=${SNOWFLAKE_ACCOUNT}
          username=${SNOWFLAKE_USER}
          password=${SNOWFLAKE_PASSWORD}
          rolename=${SNOWFLAKE_ROLE}
          warehousename=${SNOWFLAKE_WAREHOUSE}
          databasename=${SNOWFLAKE_DATABASE}
          EOF

      - name: Test Connection
        run: |
          snowsql -c prod -q "SELECT CURRENT_ACCOUNT(), CURRENT_USER(), CURRENT_ROLE();"

      - name: Execute 01ENV
        run: snowsql -c prod -f sql/01ENV.sql

      - name: Execute 02a
        run: snowsql -c prod -f sql/02a.sql

      - name: Execute 02b
        run: snowsql -c prod -f sql/02b.sql

      - name: Execute Validation Checks
        run: snowsql -c prod -f sql/03checks.sql

      - name: Execute Deploy App
        run: snowsql -c prod -f "sql/04deployapp.sql" 
