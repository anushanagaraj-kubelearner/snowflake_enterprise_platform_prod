name: Snowflake Production Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-cli-labs

      - name: Configure Snowflake Connection
        run: |
          mkdir -p ~/.snowflake

          cat > ~/.snowflake/config.toml << EOF
          default_connection_name = "prod"

          [connections.prod]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USER}"
          password = "${SNOWFLAKE_PASSWORD}"
          role = "${SNOWFLAKE_ROLE}"
          warehouse = "${SNOWFLAKE_WAREHOUSE}"
          database = "${SNOWFLAKE_DATABASE}"
          EOF

      - name: Verify Connection
        run: |
          snow connection test

      - name: Execute 01ENV
        run: |
          snow sql -f sql/01ENV.sql

      - name: Execute 02a
        run: |
          snow sql -f sql/02a.sql

      - name: Execute 02b
        run: |
          snow sql -f sql/02b.sql

      - name: Execute Validation Checks
        run: |
          snow sql -f sql/03checks.sql

      - name: Execute Deploy App
        run: |
          snow sql -f sql/04deployapp.sql
