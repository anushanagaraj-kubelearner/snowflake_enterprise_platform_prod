name: Snowflake Production Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWSQL_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SnowSQL
        run: |
          pip install snowflake-cli-labs

      - name: Verify Connection
        run: |
          snow connection test

      - name: Execute 01ENV
        run: |
          snowsql -f sql/01ENV.sql

      - name: Execute 02a
        run: |
          snowsql -f sql/02a.sql

      - name: Execute 02b
        run: |
          snowsql -f sql/02b.sql

      - name: Execute Deploy App
        run: |
          snowsql -f "sql/04deployapp.sql"

      - name: Execute Validation Checks
        run: |
          snowsql -f sql/03checks.sql
